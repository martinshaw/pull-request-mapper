<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pull Request Mapper">
  <defs>
    <linearGradient id="bg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Stack edges: three heads merge into one base (child → parent) -->
  <g fill="none" stroke="#99f6e4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 24v6"/>
    <path d="M32 24v6"/>
    <path d="M46 24v6"/>
    <path d="M18 30h28"/>
    <path d="M32 30v12"/>
  </g>

  <!-- Leaf / dependent PRs -->
  <circle cx="18" cy="20" r="5" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <circle cx="32" cy="20" r="5" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <circle cx="46" cy="20" r="5" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>

  <!-- Root / merge base (highlighted like the diagram) -->
  <circle cx="32" cy="48" r="6.5" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
</svg>
